[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tel-suma"
version = "0.1.0"
description = "Telegram unread message summarizer"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "Telethon>=1.41,<2.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
